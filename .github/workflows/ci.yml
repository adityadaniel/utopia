name: CI

# Documentation does not change what cargo builds or tests: no crate includes a Markdown file
# or anything under docs/. A change that touches only these paths starts no run. A change
# that also touches code still runs, because every changed file must match the list.
# Keep the two lists the same.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".agents/**"
      - ".claude/**"
  workflow_dispatch:

# A new push to a PR makes the previous run irrelevant; macOS minutes are expensive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # GPUI and Loro rlibs fill the disk fast when features change (see AGENTS.md).
  CARGO_INCREMENTAL: 0

jobs:
  check:
    # macOS only: the app links AppKit, PDFKit and the macOS keychain, and utopia-store
    # builds SQLCipher. There is no Linux target to check against.
    name: build, test, clippy, fmt
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Point at the installed Xcode
        # The bundle is renamed by every Xcode release, so ask rather than hardcode.
        run: echo "DEVELOPER_DIR=$(xcode-select -p)" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          # The first build compiles GPUI and takes several minutes; share the cache
          # across jobs on the same OS.
          shared-key: macos-15

      # Formatting first: it is seconds, and failing early saves a long build.
      # zed-font-kit is patched to a fork (root Cargo.toml). If a GPUI upgrade moves off the
      # patched version, cargo silently stops using it and the glyph clipping returns.
      - name: zed-font-kit patch still applies
        run: |
          cargo tree -p gpui -i zed-font-kit --locked | head -1 | grep -q 'github.com/adityadaniel/font-kit' \
            || { echo "::error::zed-font-kit [patch.crates-io] is not used; see AGENTS.md"; exit 1; }

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `xtask bench` is deliberately not run here: it asserts the §15.1 performance
      # budgets, and a shared CI runner's timings are not comparable to a real machine.
      # Run it locally in release before changing anything performance-sensitive.

  linux-cli:
    # The standalone `ut` (crates/utopia-cli) is the one part meant to run on Linux: it has no
    # GPUI, and on Linux it keeps sync secrets in a 0600 file (ADR 0014). Build and test it
    # there, then run a real `ut sync setup` and check the file it writes.
    name: ut on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-latest

      - name: No GPUI in ut
        run: |
          ! cargo tree --locked -p utopia-cli -e normal | grep -q gpui \
            || { echo "::error::utopia-cli depends on gpui"; exit 1; }

      - name: cargo build
        run: cargo build --locked -p utopia-cli

      - name: cargo test
        run: cargo test --locked -p utopia-cli -p utopia-sync

      - name: cargo clippy
        run: cargo clippy --locked -p utopia-cli -p utopia-sync --all-targets -- -D warnings

      - name: ut sync setup keeps secrets in a 0600 file
        run: |
          set -eu
          export UTOPIA_CONFIG_DIR="$RUNNER_TEMP/utcfg"
          mkdir -p "$RUNNER_TEMP/folder"
          printf 'ci-token\nci-passphrase\n' | target/debug/ut sync setup \
            --graph "$RUNNER_TEMP/g.utopia" --mode folder --folder "$RUNNER_TEMP/folder" \
            --graph-id ci --token-stdin --passphrase-stdin
          test "$(stat -c %a "$UTOPIA_CONFIG_DIR/credentials.json")" = 600
          test "$(stat -c %a "$UTOPIA_CONFIG_DIR")" = 700
          target/debug/ut sync status --graph "$RUNNER_TEMP/g.utopia" | grep -q "token stored, passphrase stored"
          target/debug/ut sync --graph "$RUNNER_TEMP/g.utopia"
          chmod 644 "$UTOPIA_CONFIG_DIR/credentials.json"
          if target/debug/ut sync --graph "$RUNNER_TEMP/g.utopia"; then
            echo "::error::ut used a credentials file that others can read"; exit 1
          fi
