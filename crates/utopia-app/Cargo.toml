[package]
name = "utopia-app"
description = "Utopia desktop app: window, keymap, menus, CLI (doctor, export)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "utopia"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
gpui.workspace = true
utopia-api.workspace = true
utopia-core.workspace = true
utopia-store.workspace = true
utopia-sync.workspace = true
utopia-syncd = { path = "../utopia-syncd" }
utopia-ui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
objc = "0.2"
png = "0.17"
raw-window-handle = "0.6"

[dev-dependencies]
tempfile.workspace = true
# Drives `Root`/`AppState` through GPUI's test platform (the quit path, the Settings
# window's handle) without a screen.
gpui = { workspace = true, features = ["test-support"] }

# The `objc` crate's `msg_send!` expands to `cfg(feature = "cargo-clippy")`, a pattern
# current rustc flags. The warning is attributed to our call sites (pdf.rs, shot.rs) but
# comes from the macro, and objc is unmaintained, so declare the value as expected rather
# than let `-D warnings` fail the build on a dependency's spelling.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
