[package]
name = "utopia-ui"
description = "Utopia GPUI components: block editor, outline view, panels, sidebars"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
chrono.workspace = true
gpui.workspace = true
# Same major as GPUI's, so page images are handed over as `RenderImage` frames.
image = { version = "0.25", default-features = false }
serde.workspace = true
serde_json.workspace = true
# A spine writes its title one grapheme per line (DESIGN.md §4.3).
unicode-segmentation.workspace = true
utopia-core.workspace = true
utopia-plugin.workspace = true
utopia-store.workspace = true
utopia-sync.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
foreign-types = "0.5"
objc = "0.2"
png = "0.17"

[dev-dependencies]
tempfile.workspace = true
gpui = { workspace = true, features = ["test-support"] }

# tests/glyph_bounds.rs measures glyphs through the same font-kit (patched to the fork,
# see the workspace Cargo.toml) and CoreText calls gpui uses.
[target.'cfg(target_os = "macos")'.dev-dependencies]
core-text = "21"
pathfinder_geometry = "0.5"
zed-font-kit = "0.14.1-zed"

# The `objc` crate's `msg_send!` expands to `cfg(feature = "cargo-clippy")`, a pattern
# current rustc flags. The warning is attributed to our call sites (pdf.rs, shot.rs) but
# comes from the macro, and objc is unmaintained, so declare the value as expected rather
# than let `-D warnings` fail the build on a dependency's spelling.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
