[workspace]
resolver = "2"
members = ["crates/utopia-core", "crates/utopia-doc", "crates/utopia-store", "crates/utopia-sync", "crates/utopia-ui", "crates/utopia-app", "crates/utopia-proto", "crates/utopia-syncd", "crates/utopia-api", "crates/utopia-plugin", "crates/utopia-ffi", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
utopia-core = { path = "crates/utopia-core" }
utopia-doc = { path = "crates/utopia-doc" }
utopia-store = { path = "crates/utopia-store" }
utopia-sync = { path = "crates/utopia-sync" }
utopia-ui = { path = "crates/utopia-ui" }
utopia-api = { path = "crates/utopia-api" }
utopia-plugin = { path = "crates/utopia-plugin" }
utopia-proto = { path = "crates/utopia-proto" }

anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
caseless = "0.2"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Pinned exactly: GPUI is pre-1.0 (PRD risk R1). runtime_shaders avoids needing the Metal toolchain.
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
libc = "0.2"
loro = "1.17"
mdns-sd = "0.21"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
url = "2"
security-framework = "3.7"
futures-util = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
thiserror = "2.0"
tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
ulid = "1.1"
ureq = "2.12"
zstd = "0.13"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
uuid = { version = "1.10", features = ["v5"] }

[profile.dev.package."*"]
opt-level = 1

# gpui 0.2.2 measures each glyph's bitmap from a 16 pt instance of the font, scaled; the
# system font changes shape with size (optical sizing), so headings and titles drew with
# their left edge cut off. The fork (branch utopia/glyph-bounds: zed-font-kit 0.14.1-zed
# plus one commit) measures at the drawn size. CI fails if this patch stops applying, so a
# GPUI upgrade that moves off 0.14.1-zed is noticed: then drop it, or re-apply it to the new
# version if the bug is still there. Upstream: zed-industries/zed#45957, #63469.
[patch.crates-io]
zed-font-kit = { git = "https://github.com/adityadaniel/font-kit", rev = "753458b2a14f2b72d0f740a1c70681d5e9529f0c" }
